# Runs on the Oracle Cloud Always Free VM.
#   cd ~/tilt/deploy
#   docker compose run --rm migrate      # apply DB migrations (release step)
#   docker compose up -d --build api caddy
services:
  api:
    build:
      context: ../api
      target: runtime
    env_file: ../api/.env
    restart: unless-stopped
    expose:
      - "4000"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  migrate:
    build:
      context: ../api
      target: migrate
    env_file: ../api/.env
    profiles: ["tools"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
